apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: onetouch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306

        env:
        - name: MYSQL_ROOT_PASSWORD                      # mysql database is created with this root_password
          valueFrom:
            secretKeyRef:
              name: mysql-secret                        #  
              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_DATABASE

        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER

        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASS

        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql

        # agar init scripts configmap me diye ho to mount karo
        - name: mysql-initdb                              # ye wahi name hona chahiye jo niche volumes me diya hai
          mountPath: /docker-entrypoint-initdb.d

      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pvc

      - name: mysql-initdb                               # 
        configMap:
          name: mysql-config

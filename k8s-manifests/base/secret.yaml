apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: onetouch
type: Opaque
data:
  MYSQL_USER: bXlzcWwtdXNlcg==        # base64 for 'mysql-user'
  MYSQL_PASS: cGFzc3dvcmQxMjM=       # base64 for 'password123'    
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3MxMjM=  # base64 for 'rootpass123' 
   
  # Note: Ensure these base64 values match those referenced in deployment.yaml